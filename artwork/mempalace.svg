<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -245 280 335">
  <defs>
    <linearGradient id="left-facet" x1="0" y1="-140" x2="-130" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(2, 132, 199, 0.4)"/>
      <stop offset="1" stop-color="rgba(3, 105, 161, 0.1)"/>
    </linearGradient>
    <linearGradient id="right-facet" x1="0" y1="-140" x2="130" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(3, 105, 161, 0.45)"/>
      <stop offset="1" stop-color="rgba(30, 64, 175, 0.12)"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="0" cy="0" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284C7" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#BAE6FD" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam-glow" x1="0" y1="-240" x2="0" y2="-140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(2, 132, 199, 0)"/>
      <stop offset="0.6" stop-color="rgba(2, 132, 199, 0.8)"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Rising beacon beam -->
    <line x1="0" y1="-140" x2="0" y2="-235" stroke="url(#beam-glow)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="-140" x2="0" y2="-210" stroke="#0369A1" stroke-width="4.5" opacity="0.55" stroke-linecap="round" />

    <!-- Back facets (inner crystal depth) -->
    <polygon points="0,-140 0,-20 130,30" stroke="#0369A1" stroke-width="1.4" fill="none" opacity="0.45" />
    <polygon points="0,-140 0,-20 -130,30" stroke="#0369A1" stroke-width="1.4" fill="none" opacity="0.45" />
    <polygon points="0,-140 -130,30 0,80 130,30" stroke="#0369A1" stroke-width="1.4" fill="none" opacity="0.35" />

    <!-- Base crystal floor -->
    <polygon points="0,80 130,30 0,-20 -130,30" fill="rgba(186, 230, 253, 0.4)" stroke="#0284C7" stroke-width="2.4" />

    <!-- Front-left facet -->
    <polygon points="0,-140 -130,30 0,80" fill="url(#left-facet)" stroke="#0284C7" stroke-width="2.8" />

    <!-- Front-right facet -->
    <polygon points="0,-140 130,30 0,80" fill="url(#right-facet)" stroke="#0284C7" stroke-width="2.8" />

    <!-- Central & horizontal crystal axis -->
    <line x1="0" y1="-140" x2="0" y2="80" stroke="#0369A1" stroke-width="2" opacity="0.75" />
    <line x1="-130" y1="30" x2="130" y2="30" stroke="#0369A1" stroke-width="2" opacity="0.75" />

    <!-- Inner nested crystal pyramid -->
    <g opacity="0.8">
      <polygon points="0,-80 70,15 0,50 -70,15" stroke="#0284C7" stroke-width="1.6" fill="none" />
      <line x1="0" y1="-80" x2="0" y2="50" stroke="#0284C7" stroke-width="1.6" />
    </g>

    <!-- Glowing core beacon -->
    <circle cx="0" cy="0" r="34" fill="url(#core-glow)" />
    <circle cx="0" cy="0" r="4.5" fill="#0284C7" />
  </g>
</svg>