name: Security
on:
  push:
    branches:
      - main
      - '**'

  pull_request:
    branches:
      - main
      - '**'

jobs:
  Security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Check SVG structure and shared references
        run: python3 scripts/audit_svgs.py
      - name: Check reviewed brand artwork
        run: python3 scripts/generate_brand_icons.py --check
      - name: set permission to security script
        run: chmod +x ./.github/security.sh
      - name: check icons formatting
        run: ./.github/security.sh 0
      - name: check for xss attack
        run: ./.github/security.sh 1
